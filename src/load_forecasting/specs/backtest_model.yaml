# Backtest Model Specification
# For AlphaBuilding-Agents SpecRegistry and AI discovery

id: forecasting.backtest_model
version: "1.0.0"
mcp_server: load_forecasting
mcp_tool: backtest_model

category: forecasting
tags: [load_forecasting, backtesting, evaluation, rolling_window, metrics, darts]
description: >
  Run a rolling-window backtest of a trained model on historical data.
  Similar to evaluate_forecast_model but with configurable stride and start
  position, making it easy to assess model performance across many historical
  windows rather than a single test split.  Uses the same rolling-forecast
  engine as generate_forecast for consistent results.

# ==============================================================================
# INPUTS
# ==============================================================================
inputs:
  # --- Model Selection ---
  - name: model_id
    type: string
    required: true
    description: >
      ID of a trained model (returned from train_forecast_model or tune_model).
      Use list_models to see available models.
    example: "Building_33_LinearRegression_20250124_143022"

  # --- Historical Data ---
  - name: csv_path
    type: string
    required: true
    delivery_mode: file_reference
    description: >
      Path to CSV with historical data. Should have the same column structure
      as the training data and ideally cover a longer period than the training
      data for a meaningful out-of-sample assessment.
    example: "/data/building_33_2024.csv"

  - name: column_mapping
    type: object
    required: false
    description: >
      Column role mapping. If not provided, the mapping stored in the model
      metadata from training is used. Only specify if the CSV has different
      column names than the training data.

  # --- Rolling Window Parameters ---
  - name: stride_hours
    type: integer
    required: false
    minimum: 1
    maximum: 96
    description: >
      Step size between forecast windows in hours. Defaults to the model's
      training horizon (non-overlapping windows). Use a smaller value for
      overlapping windows and finer temporal coverage of prediction errors.
    example: 6

  - name: start_fraction
    type: number
    required: false
    default: 0.2
    minimum: 0.1
    maximum: 0.5
    description: >
      Fraction of the series to skip before starting the rolling forecast.
      Ensures the model has enough historical context to warm up (lag features,
      seasonality). Default 0.2 means the first 20% of the series is skipped.
      Applied only when backtest_start_date is not given; passing both is an
      error. Prefer backtest_start_date to score a specific period.

  # --- Output Options ---
  - name: return_predictions
    type: boolean
    required: false
    default: true
    description: >
      Include per-step predictions (timestamp, actual, predicted, residual)
      in the response. Can be large for long series; use output_csv_path
      for big datasets.

  - name: output_csv_path
    type: string
    required: false
    description: Optional path to write predictions as a CSV file.
    example: "/data/backtest_output.csv"

  - name: include_residual_analysis
    type: boolean
    required: false
    default: false
    description: Include residual statistics (mean, std, autocorrelation).

  - name: peak_dates
    type: array
    required: false
    items: { type: string, format: "date", example: "2023-02-22" }
    description: >
      Optional list of date strings ("YYYY-MM-DD") identifying peak demand days
      to evaluate with PMAPE and PTE metrics (Li et al. 2025, Table 5).
      When provided, a peak_metrics key is added to the response.
      Paper winter peak window: ["2023-02-22","2023-02-23","2023-02-24","2023-02-25"]
      Paper summer peak window: ["2023-08-14","2023-08-15","2023-08-16","2023-08-17"]

  - name: num_samples
    type: integer
    required: false
    default: 200
    description: >
      Monte-Carlo sample count for models trained with probabilistic=True.
      Triggers a second, stochastic rolling pass that adds a
      probabilistic_metrics key: pooled pinball loss / coverage / interval
      width, plus horizon_coverage — empirical coverage and mean interval
      width broken out per h-step-ahead position. The per-horizon breakdown is
      the diagnostic that pooled coverage cannot provide, since an
      over-covered near horizon and an under-covered far horizon average to a
      healthy-looking overall number. Ignored for point models, which pay no
      extra cost.

  # --- Date window (contiguous) ---
  - name: start_date
    type: string
    required: false
    example: "2023-01-01"
    description: >
      Inclusive start of the rows to use ('YYYY-MM-DD' or 'YYYY-MM-DD
      HH:MM'). Rows before it are not scored or trained on, but up to
      the longest lag (168 h by default) is still read so lag features
      at the start of the window are computed from real history.

  - name: end_date
    type: string
    required: false
    example: "2023-10-31"
    description: >
      Inclusive end of the rows to use. A date-only value ('YYYY-MM-DD')
      includes that whole day, so '2023-10-31' keeps everything through
      23:00 and drops November-December. A value with a time
      ('YYYY-MM-DD HH:MM') is inclusive of that instant. Naive values
      are read in the CSV's own clock; add a UTC offset to anchor them
      otherwise. Rows after it are dropped before any validation, so bad
      data in an excluded tail cannot fail the call. Only a contiguous
      window is supported; to skip a mid-series period, run two
      backtests.

  - name: backtest_start_date
    type: string
    required: false
    example: "2023-01-09"
    description: >
      Timestamp of the first forecast to score, as an alternative to
      start_fraction (pass one or the other, not both). Earlier rows are
      used only as model context. It must leave enough history for the
      lag features (168 h by default) plus the model's lookback; when it
      does not, the error names the earliest valid date. With start_date
      set and earlier history in the file, the lag history comes from
      before start_date, so only the lookback is needed. Use it to score
      as much of a period as possible with an already-trained model.

# ==============================================================================
# OUTPUTS
# ==============================================================================
outputs:
  success:
    type: boolean
    description: Whether the backtest completed successfully

  error:
    type: string
    description: Error message if success=false

  model_id:
    type: string
    description: Model that was backtested

  model_type:
    type: string
    description: Type of model (e.g. LinearRegression, XGBoost)

  backtest_metrics:
    type: object
    description: Aggregate performance metrics across all rolling windows
    properties:
      rmse: { type: number, units: "same as target" }
      mae: { type: number, units: "same as target" }
      mape: { type: number, units: "%" }
      cv_rmse: { type: number, units: "%", description: "(rmse / mean_actual) * 100" }
      r_squared: { type: number, description: "1 - (SS_res / SS_tot)" }

  comparison_to_validation:
    type: object
    description: Compare backtest metrics to validation metrics from training
    properties:
      cv_rmse_diff: { type: number, description: "backtest_cv_rmse - validation_cv_rmse" }
      performance_status:
        type: string
        enum: ["similar", "degraded", "improved"]
        description: >
          Whether backtest performance is similar to validation.
          Difference <= 5% CV-RMSE is considered similar.

  backtest_summary:
    type: object
    properties:
      n_windows: { type: integer, description: "Number of forecast windows evaluated" }
      stride_hours: { type: integer }
      stride_steps: { type: integer, description: "Stride in data steps" }
      start_mode:
        type: string
        enum: ["fraction", "date"]
        description: "Whether the first forecast came from start_fraction or backtest_start_date"
      start_fraction: { type: number, description: "null when start_mode is 'date'" }
      backtest_start_date: { type: string, format: datetime, description: "Timestamp of the first scored forecast" }
      backtest_end_date: { type: string, format: datetime }
      requested_backtest_start_date: { type: string, description: "As passed (start_mode 'date' only)" }
      earliest_valid_backtest_start_date: { type: string, format: datetime, description: "Earliest first forecast the data allows (start_mode 'date' only)" }
      date_window:
        type: object
        description: "Present when start_date/end_date was given"
        properties:
          start_date: { type: string }
          end_date: { type: string }
          rows_in_window: { type: integer }
          rows_excluded: { type: integer }
          first_timestamp: { type: string, format: datetime }
          last_timestamp: { type: string, format: datetime }
          file_start: { type: string, format: datetime }
          file_end: { type: string, format: datetime }
      total_samples: { type: integer }
      column_mapping_source:
        type: string
        enum: ["provided", "from_model_metadata"]

  predictions:
    type: array
    description: Per-step predictions (if return_predictions=true)
    items:
      type: object
      properties:
        timestamp: { type: string, format: datetime }
        actual: { type: number }
        predicted: { type: number }
        residual: { type: number, description: "actual - predicted" }

  residual_analysis:
    type: object
    description: Residual statistics (if include_residual_analysis=true)
    properties:
      mean_residual: { type: number, description: "Should be ~0 for unbiased model" }
      std_residual: { type: number }
      autocorrelation_lag1: { type: number, description: "Should be ~0 for good model" }

  output_csv_path:
    type: string
    description: Path to saved CSV if output_csv_path was provided

  peak_metrics:
    type: object
    description: >
      Peak load prediction metrics per Li et al. (2025), Table 5.
      Only present when peak_dates is supplied.
    properties:
      peak_mape: { type: number, units: "%", description: "Mean PMAPE across peak days" }
      peak_timing_error_hours: { type: number, units: "hours", description: "Mean PTE across peak days" }
      n_peak_days_evaluated: { type: integer }
      n_peak_days_skipped: { type: integer }
      per_day:
        type: array
        items:
          type: object
          properties:
            date: { type: string }
            actual_peak_value: { type: number }
            predicted_peak_value: { type: number }
            actual_peak_hour: { type: integer }
            predicted_peak_hour: { type: integer }
            peak_magnitude_error_pct: { type: number }
            peak_timing_error_hours: { type: number }

  probabilistic_metrics:
    type: object
    description: >
      Prediction-interval quality. Only present for models trained with
      probabilistic=True.
    properties:
      pinball_loss: { type: number, description: "Mean pinball loss over quantile levels" }
      coverage: { type: number, description: "Pooled empirical coverage of the widest central band" }
      nominal_coverage: { type: number, description: "Target coverage, e.g. 0.8 for P10-P90" }
      mean_interval_width: { type: number, units: "same as target", description: "Sharpness" }
      per_quantile_pinball: { type: object, description: "Pinball loss keyed by quantile level" }
      quantiles: { type: array, items: { type: number } }
      num_samples: { type: integer }
      n_windows: { type: integer, description: "Stochastic rolling windows evaluated" }
      band:
        type: object
        description: Outermost quantile pair straddling the median
        properties:
          lower: { type: number }
          upper: { type: number }
          nominal: { type: number }
      horizon_coverage:
        type: array
        description: >
          Per-h-step-ahead interval calibration. Compare each entry's coverage
          against nominal_coverage: entries below it are under-covered, meaning
          the model is overconfident at that lead time.
        items:
          type: object
          properties:
            h: { type: integer, description: "Horizon step, 1 = one-step-ahead" }
            coverage: { type: number }
            mean_interval_width: { type: number }
            n: { type: integer, description: "Aligned pairs at this step" }

# ==============================================================================
# NOTES
# ==============================================================================
notes:
  - "Use list_models to find available model IDs before calling this tool"
  - "Column mapping from training is automatically reused if not specified"
  - "Backtest uses retrain=False — model weights do not change during backtesting"
  - "stride_hours < horizon_hours produces overlapping windows (more points, correlated errors)"
  - "start_fraction=0.2 ensures 20% of data is used as warm-up before rolling starts"
  - "To score a specific period, combine end_date (and optionally start_date) with backtest_start_date, e.g. 2023 excluding Nov-Dec: end_date='2023-10-31', backtest_start_date='2023-01-09'"
  - "If backtest_start_date is too early the error names the earliest valid date; retry with that value"
  - "start_date/end_date select one contiguous window; do not cut a mid-series period out of a CSV, because missing timestamps are re-inserted and interpolated"
  - "CV-RMSE difference vs validation > 5pp suggests distributional shift in this period"
  - "Predictions array can be large; use output_csv_path for long series"
  - "Unlike evaluate_forecast_model, backtest_model allows custom start position and stride"
  - "Use generate_forecast for live forward predictions; use backtest_model for historical assessment"
  - "probabilistic_metrics appears only for models trained with probabilistic=True (XGBoost, LSTM, TFT, TiDE, TSMixer)"
  - "Prefer horizon_coverage over the pooled coverage figure: pooled coverage averages every lead time and can mask an over-covered h=1 offsetting an under-covered h=24"
  - "Interval width should grow with h; a flat width profile alongside falling coverage means uncertainty is not being propagated"
  - "The stochastic pass is a second rolling forecast — expect roughly double the runtime for quantile models"
  - "stride_hours maximum raised to 96 to support the paper's 96h horizon configuration"
  - "Use peak_dates with paper windows to compute PMAPE and PTE alongside aggregate metrics"
