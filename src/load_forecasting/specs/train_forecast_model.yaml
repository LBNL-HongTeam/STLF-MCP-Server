# Train Forecast Model Specification
# For AlphaBuilding-Agents SpecRegistry and AI discovery

id: forecasting.train_model
version: "1.0.0"
mcp_server: load_forecasting
mcp_tool: train_forecast_model

category: forecasting
tags: [load_forecasting, training, time_series, machine_learning, darts]
description: >
  Train a time-series forecasting model on historical building load data.
  Evaluates on a validation split and persists the trained model for later use.
  Supports naive baselines, regression, boosted trees, classical statistical
  models, deep-learning models, and TimesFM foundation-model workflows.

# ==============================================================================
# INPUTS
# ==============================================================================
inputs:
  # --- Data Source ---
  - name: csv_path
    type: string
    required: true
    delivery_mode: file_reference
    description: >
      Path to CSV file with datetime index and load data.
      Must have a datetime column and at least one numeric target column.
    example: "/data/building_33_hourly.csv"
    expected_columns:
      - datetime
      - target
    constraints:
      min_duration: "P3M"
      min_coverage: 0.90
      frequency: ["15min", "30min", "h"]

  - name: column_mapping
    type: object
    required: false
    description: >
      Map CSV column names to expected roles. If not provided,
      tool will attempt auto-detection based on column names.
    properties:
      datetime:
        type: string
        description: Column containing timestamps
        example: "timestamp"
        auto_detect_patterns: ["datetime", "timestamp", "date", "time", "dt"]
      target:
        type: string
        description: Column containing load values to forecast
        example: "Electricity_kWh"
        auto_detect_patterns: ["kwh", "load", "power", "energy", "electricity", "demand"]
      past_covariates:
        type: array
        items: { type: string }
        description: Optional weather/feature columns known only for past timesteps
        example: ["T_out", "RH_out"]
        auto_detect_patterns: ["temp", "temperature", "rh", "humidity", "solar", "wind"]
      future_covariates:
        type: array
        items: { type: string }
        description: >
          Optional columns that are known for both past and future timesteps
          (e.g. weather forecasts, calendar variables not auto-generated by the
          loader).  Not auto-detected — must be listed explicitly.
          Supported by LinearRegression, XGBoost, ARIMA, TFT, TiDE, TSMixer,
          and TimesFM+Residual. LSTM ignores future covariates, and pure TimesFM
          ignores all covariates.
        example: ["T_out_forecast", "solar_irradiance_forecast"]

  # --- Model Configuration ---
  - name: model_type
    type: string
    required: false
    default: "LinearRegression"
    enum:
      - "NaiveMean"
      - "NaiveSeasonal"
      - "NaiveMovingAverage"
      - "LinearRegression"
      - "XGBoost"
      - "LSTM"
      - "ARIMA"
      - "TFT"
      - "TiDE"
      - "TSMixer"
      - "TimesFM"
      - "TimesFM+Residual"
    description: >
      Forecasting model type. Start with LinearRegression to establish a baseline,
      then try XGBoost for better accuracy without extra dependencies, LSTM or TFT
      for deep learning (requires torch + pytorch-lightning), TiDE or TSMixer for
      MLP-based multi-horizon deep learning (top performers in Li et al. 2025 for
      long-horizon and peak load prediction), or ARIMA for classical statistical
      forecasting (requires statsmodels).
      Note: ARIMA ignores lookback_hours and past covariates; use p/d/q kwargs instead.
      TimesFM: Google's 200M-parameter foundation model (TimesFM 2.5). Pretrained
      weights are auto-downloaded from HuggingFace Hub on first use (~800MB).
      Does NOT support past or future covariates. Hard limit: horizon_hours <= 128
      at hourly frequency (32 hours at 15-min frequency).
      TimesFM+Residual: TimesFM 2.5 backbone plus a Ridge regression residual
      corrector that consumes past and future covariates externally. Detects a
      temperature column automatically and adds HDD/CDD + spline features to
      capture nonlinear weather effects. Inherits TimesFM's horizon and context
      limits. Evaluation is slower than pure TimesFM because rolling forecasts
      run outside Darts' historical_forecasts dispatch.

  # --- Temporal Parameters ---
  - name: lookback_hours
    type: integer
    required: false
    default: 24
    minimum: 1
    maximum: 168
    description: Hours of history to use as model input (input window)

  - name: horizon_hours
    type: integer
    required: false
    default: 6
    minimum: 1
    maximum: 96
    description: >
      Hours ahead to forecast (prediction horizon). Maximum raised to 96h to match
      Li et al. (2025) which uses a 96h horizon for cross-dimensional evaluation.

  - name: frequency
    type: string
    required: false
    default: "h"
    enum: ["15min", "30min", "h"]
    description: Data frequency. Must match actual data frequency.

  # --- Training Parameters ---
  - name: validation_split
    type: number
    required: false
    default: 0.2
    minimum: 0.1
    maximum: 0.3
    description: >
      Fraction of data to hold out for validation.
      Uses temporal split (last N% of data), not random.

  # --- Weather Augmentation (Li et al. 2025) ---
  - name: augment_weather_noise
    type: boolean
    required: false
    default: false
    description: >
      If true, add Gaussian noise to future covariate columns during training
      to simulate weather forecast uncertainty (Li et al. 2025, Section 3.1.2).
      Applied to training data only; has no effect if no future_covariates are
      provided. Helps reduce peak load underestimation by exposing the model to
      a wider range of temperature forecast scenarios.

  - name: weather_noise_std
    type: number
    required: false
    default: 1.0
    minimum: 0.0
    description: >
      Standard deviation of Gaussian noise added to future covariate columns
      when augment_weather_noise=true. Units match the raw covariate values
      (e.g. °C for temperature). Default 1.0 °C matches typical NWP forecast
      uncertainty. Only used when augment_weather_noise=true.

  # --- Metadata ---
  - name: building_name
    type: string
    required: false
    description: Building identifier (used in model naming and registry)
    example: "Building_33"

  - name: model_name
    type: string
    required: false
    description: Custom model name. Auto-generated if not provided.

  # --- Compute Device ---
  - name: device
    type: string
    required: false
    default: null
    enum: ["cuda", "mps", "cpu", "auto"]
    description: >
      Compute device for PyTorch-backed models (LSTM, TFT, TiDE, TSMixer,
      TimesFM, TimesFM+Residual). "cuda" uses an NVIDIA GPU, "mps" uses the
      Apple Silicon GPU, "cpu" forces CPU, and "auto" (or omitting the field)
      auto-detects with priority cuda > mps > cpu. If the requested device is
      unavailable the trainer logs a warning and falls back to CPU. CPU-only
      models (LinearRegression, XGBoost, ARIMA, Naive*) ignore this parameter.

  # --- Algorithm-specific passthrough ---
  - name: model_kwargs
    type: object
    required: false
    default: null
    description: >
      Algorithm-specific settings forwarded to the underlying Darts model
      constructor, for options this tool does not expose as named parameters.
      Accepted keys depend on model_type; unknown keys raise an error rather
      than being silently ignored. Common uses are n_epochs, batch_size,
      dropout, optimizer_kwargs and pl_trainer_kwargs for the PyTorch models,
      n_estimators and max_depth for XGBoost, and p/d/q for ARIMA.
      A learning-rate scheduler is named as a string and resolved to the
      matching torch.optim.lr_scheduler class, because MCP arguments arrive as
      JSON. Supported names: CosineAnnealingLR, CosineAnnealingWarmRestarts,
      StepLR, MultiStepLR, ExponentialLR, ReduceLROnPlateau, OneCycleLR,
      LinearLR, ConstantLR.
      Keys that the tool sets itself (accelerator, probabilistic, quantiles,
      lookback, horizon, frequency, and the series/covariate arguments) are
      rejected; use the tool's own parameters for those. Use tune_model when
      the aim is to search these values rather than to fix them.
    example:
      n_epochs: 50
      optimizer_kwargs: {lr: 0.001, weight_decay: 0.00001}
      lr_scheduler_cls: "CosineAnnealingLR"
      lr_scheduler_kwargs: {T_max: 50}

# ==============================================================================
# PREPROCESSING
# ==============================================================================
preprocessing:
  datetime_parsing:
    format: "auto"
    timezone: "infer"

  missing_values:
    strategy: "interpolate"
    max_gap: "2h"
    edge_handling: "drop"

  normalization:
    target: "standard"
    covariates: "standard"
    persist_scalers: true

# ==============================================================================
# OUTPUTS
# ==============================================================================
outputs:
  success:
    type: boolean
    description: Whether training completed successfully

  error:
    type: string
    description: Error message if success=false

  model_id:
    type: string
    description: Unique identifier for the trained model
    example: "Building_33_LinearRegression_20250124_143022"

  model_path:
    type: string
    description: Filesystem path to saved model directory

  model_type:
    type: string
    description: Type of model trained

  training_metrics:
    type: object
    description: Performance on training data (for overfitting detection)
    properties:
      rmse: { type: number, units: "same as target" }
      mae: { type: number, units: "same as target" }
      mape: { type: number, units: "%" }

  validation_metrics:
    type: object
    description: Performance on held-out validation data (primary metrics)
    properties:
      rmse: { type: number, units: "same as target" }
      mae: { type: number, units: "same as target" }
      mape: { type: number, units: "%" }
      cv_rmse: { type: number, units: "%", description: "(rmse / mean_actual) * 100" }
      r_squared: { type: number, description: "1 - (SS_res / SS_tot)" }

  data_summary:
    type: object
    description: Summary of input data used
    properties:
      total_samples: { type: integer }
      training_samples: { type: integer }
      validation_samples: { type: integer }
      start_date: { type: string, format: "datetime" }
      end_date: { type: string, format: "datetime" }
      target_column: { type: string }
      covariate_columns: { type: array, items: { type: string }, description: "Past covariate columns used" }
      future_covariate_columns: { type: array, items: { type: string }, description: "Future covariate columns used" }
      frequency_detected: { type: string }
      missing_value_count: { type: integer }

  training_info:
    type: object
    properties:
      training_time_seconds: { type: number }
      lookback_hours: { type: integer }
      horizon_hours: { type: integer }
      darts_model_class: { type: string, description: "Underlying Darts class used" }
      energy_kwh:
        type: number
        description: >
          Estimated energy consumed during training (kWh), computed via a TDP-based
          proxy model (watts_assumed × training_time_seconds / 3_600_000).
          Follows the energy-tracking methodology of Li et al. (2025), Table 5.
      watts_assumed:
        type: integer
        description: >
          Assumed CPU power draw (W) used in the energy estimate.
          NaiveMean/NaiveSeasonal/NaiveMovingAverage: 15 W.
          LinearRegression/ARIMA: 65 W.
          XGBoost: 100 W. LSTM/TFT/TiDE/TSMixer: 165 W (paper's Xeon TDP).

# ==============================================================================
# NOTES
# ==============================================================================
notes:
  - "Model is automatically saved to the model registry"
  - "Use the returned model_id with evaluate_forecast_model or generate_forecast"
  - "Set lookback_hours=96 and horizon_hours=96 to match the Li et al. (2025) paper setup"
  - "augment_weather_noise=true simulates temperature forecast uncertainty during training (Li et al. 2025, Sec 3.1.2)"
  - "energy_kwh in training_info is a TDP-based proxy; actual consumption varies by hardware"
  - "CV-RMSE below 15% is excellent; 15-25% is acceptable for building loads"
  - "Start with LinearRegression; try XGBoost next if metrics are poor"
  - "XGBoost: gradient boosting on lagged features; supports past and future covariates"
  - "XGBoost defaults match Li et al. (2025) Table A.3: n_estimators=40, max_depth=6, booster=gbtree; lr/subsample/colsample use XGBoost library defaults"
  - "Calendar features match Li et al. (2025) Table 6: hour/dow/month sin+cos cyclic encodings, plus retained hour/dow/month integers and is_weekend"
  - "LSTM: deep learning sequential model via Darts BlockRNNModel; supports past covariates only (not future)"
  - "LSTM requires torch and pytorch-lightning to be installed"
  - "ARIMA: classical statistical model (statsmodels-backed); supports future covariates as exogenous variables; ignores lookback_hours and past covariates; tune p/d/q via model_kwargs"
  - "TFT: Temporal Fusion Transformer; supports past and future covariates; add_relative_index=True is set automatically so future covariates are optional"
  - "TFT requires torch and pytorch-lightning to be installed"
  - "TiDE: Time-series Dense Encoder (MLP encoder-decoder); supports past and future covariates; identified as a top performer for peak load and long-horizon forecasting in Li et al. (2025); defaults match paper Table A.3 (hidden_size=128, num_encoder_layers=1, num_decoder_layers=1, decoder_output_dim=16, temporal_width_past=4, temporal_width_future=4, dropout=0.1)"
  - "TSMixer: All-MLP token-mixer for time-series; supports past and future covariates; identified as a top performer for long-horizon forecasting in Li et al. (2025); defaults match paper Table A.3 (hidden_size=64, ff_size=64, num_blocks=2, activation=ReLU, dropout=0.1, norm_type=LayerNorm)"
  - "TiDE and TSMixer require torch and pytorch-lightning to be installed; both use Darts default Adam optimizer for consistency with LSTM/TFT — to match paper Appendix A (lr=1e-3, weight_decay=1e-5, cosine annealing, early stopping) pass optimizer_kwargs/lr_scheduler_cls/pl_trainer_kwargs via model_kwargs"
  - "model_kwargs reaches settings with no named tool parameter; lr_scheduler_cls is given as a string name and resolved to the torch class, so a published training schedule can be reproduced without dropping to the Python API"
  - "TiDE and TSMixer default n_epochs=20 for consistency with LSTM/TFT; the paper allows up to 50 with early stopping"
  - "TimesFM: Google TimesFM 2.5 foundation model (200M params); no covariate support (XReg pathway dropped in the port); requires torch, pytorch-lightning, and huggingface_hub; first use downloads ~800MB of weights from HuggingFace"
  - "TimesFM hard limits: output horizon <= 128 steps (one output patch); total context (lookback + horizon) <= 16384 steps"
  - "TimesFM defaults: light fine-tuning with n_epochs=5 and enable_finetuning=True; pass n_epochs=0 or enable_finetuning=False in model_kwargs for zero-shot use"
  - "TimesFM+Residual: TimesFM 2.5 backbone plus a Ridge residual regressor that consumes past and future covariates externally; auto-detects a temperature column (substring match) and adds HDD (base 18°C), CDD (base 22°C), and a 3-knot natural cubic spline basis to capture nonlinear weather effects; other covariates pass through unchanged; inherits TimesFM's horizon and context limits"
  - "TimesFM+Residual model_kwargs: alpha (Ridge regularisation, default 1.0), hdd_base (default 18.0), cdd_base (default 22.0), n_knots (default 3); TimesFM sub-model shares TimesFM's kwargs (n_epochs, enable_finetuning, local_dir, etc.)"
  - "TimesFM+Residual evaluation is significantly slower than pure TimesFM because rolling-window backtests run outside Darts' historical_forecasts dispatch (one TimesFM forward pass per stride)"
  - "Use tune_model to optimise XGBoost, LSTM, ARIMA, TFT, TiDE, or TSMixer hyperparameters automatically (TimesFM and TimesFM+Residual are not tunable via this interface)"
  - "Validation uses temporal split (last N%), not random, to respect time ordering"
  - "Column mapping is persisted in metadata.json and reused during evaluation"
