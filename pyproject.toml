[project]
name = "load-forecasting-mcp"
version = "0.1.0"
description = "MCP server for building load forecasting with time-series models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "AlphaBuilding Team" }
]
keywords = ["mcp", "forecasting", "time-series", "building", "energy", "darts"]

dependencies = [
    "darts>=0.27.0",
    "fastmcp>=2.13.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    # Pin newer numba/llvmlite for Python 3.11/3.12 compatibility
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.scripts]
load-forecasting-mcp = "load_forecasting.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/load_forecasting"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
